name: Website checks

on:
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  push:
    branches: [main, 'codex/**']
    paths: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  website:
    name: Website checks (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Check local HTTP contracts
        env:
          SITE_TEST_ORIGIN: http://localhost:3000
        run: |
          npm run dev -- --port 3000 > "$RUNNER_TEMP/workflow-site-dev.log" 2>&1 &
          site_pid=$!
          trap 'if kill -0 "$site_pid" 2>/dev/null; then kill "$site_pid"; fi' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 5 "$SITE_TEST_ORIGIN/" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$site_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/workflow-site-dev.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/workflow-site-dev.log"
            exit 1
          fi
          npm test
